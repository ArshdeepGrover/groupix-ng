<button
  data-drawer-target="default-sidebar"
  data-drawer-toggle="default-sidebar"
  aria-controls="default-sidebar"
  type="button"
  class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
>
  <span class="sr-only">Open sidebar</span>
  <svg
    class="w-6 h-6"
    aria-hidden="true"
    fill="currentColor"
    viewBox="0 0 20 20"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      clip-rule="evenodd"
      fill-rule="evenodd"
      d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
    ></path>
  </svg>
</button>

<aside
  id="default-sidebar"
  class="fixed top-16 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0"
  aria-label="Sidebar"
  aria-hidden="false"
>
  <div class="h-full px-3 py-4 overflow-y-auto bg-gray-50 dark:bg-gray-800">
    <ul class="space-y-2 font-medium">
      <li>
        <div class="group-name" *ngIf="group">Group Name: {{ group.name }}</div>
      </li>
      <!-- Dashboard -->
      <li>
        <a
          [routerLink]="'.'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 22 21"
          >
            <path
              d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z"
            />
            <path
              d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188.028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z"
            />
          </svg>
          <span class="ms-3">Dashboard</span>
        </a>
      </li>

      <!-- Members -->
      <li>
        <a [routerLink]="['members']" routerLinkActive="active">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 20 18"
          >
            <path
              fill-rule="evenodd"
              d="M12 6a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm-1.5 8a4 4 0 0 0-4 4 2 2 0 0 0 2 2h7a2 2 0 0 0 2-2 4 4 0 0 0-4-4h-3Zm6.82-3.096a5.51 5.51 0 0 0-2.797-6.293 3.5 3.5 0 1 1 2.796 6.292ZM19.5 18h.5a2 2 0 0 0 2-2 4 4 0 0 0-4-4h-1.1a5.503 5.503 0 0 1-.471.762A5.998 5.998 0 0 1 19.5 18ZM4 7.5a3.5 3.5 0 0 1 5.477-2.889 5.5 5.5 0 0 0-2.796 6.293A3.501 3.501 0 0 1 4 7.5ZM7.1 12H6a4 4 0 0 0-4 4 2 2 0 0 0 2 2h.5a5.998 5.998 0 0 1 3.071-5.238A5.505 5.505 0 0 1 7.1 12Z"
              clip-rule="evenodd"
            />
          </svg>
          <span class="flex-1 ms-3 whitespace-nowrap">Members</span>
        </a>
      </li>

      <!-- Bills -->
      <li>
        <a [routerLink]="['bills']" routerLinkActive="active">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 52 52"
            fill="currentColor"
          >
            <path
              d="M15.89 2.578c2.053-.326 5.577-.734 10.324-.734s8.271.408 10.325.734c1.48.234 2.478 1.523 2.478 2.98 0 2.355-.96 4.486-2.51 6.022l-.11.022c-.486.094-1.22.222-2.183.35-1.928.257-4.78.518-8.422.518-3.643 0-6.495-.26-8.423-.518a43.369 43.369 0 0 1-1.253-.185 8.456 8.456 0 0 1-2.705-6.21c0-1.456 1-2.745 2.479-2.98Zm-1.341 12.147.033.007a41.28 41.28 0 0 0 2.366.38c2.057.274 5.05.545 8.844.545 3.794 0 6.787-.27 8.843-.545a41.119 41.119 0 0 0 2.367-.38 23.869 23.869 0 0 0 .685-.143c2.798 1.963 5.212 4.535 7.085 7.372 2.686 4.068 4.286 8.722 4.286 12.972 0 5.437-2.619 9.154-6.808 11.48-4.153 2.305-9.836 3.243-16.036 3.243-6.2 0-11.883-.938-16.035-3.243-4.19-2.326-6.808-6.043-6.808-11.48 0-4.25 1.6-8.904 4.286-12.972 1.83-2.772 4.176-5.29 6.892-7.236Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="4"
              class="dollar-sign"
              d="M22 37.344a4.76 4.76 0 0 0 2.558 1.62c2.274.588 4.512-.447 4.999-2.312.487-1.865-1.273-3.898-3.546-4.489-2.273-.59-4.034-2.623-3.547-4.488.486-1.865 2.724-2.899 4.998-2.31.982.236 1.87.793 2.538 1.592m-3.879 12.171V41m0-18v2.2"
            />
          </svg>
          <span class="flex-1 ms-3 whitespace-nowrap">Bills</span>
        </a>
      </li>

      <!-- Edit -->
      <li>
        <a [routerLink]="['edit']" routerLinkActive="active">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              d="M5 5V.13a2.96 2.96 0 0 0-1.293.749L.879 3.707A2.96 2.96 0 0 0 .13 5H5Z"
            />
            <path
              d="M6.737 11.061a2.961 2.961 0 0 1 .81-1.515l6.117-6.116A4.839 4.839 0 0 1 16 2.141V2a1.97 1.97 0 0 0-1.933-2H7v5a2 2 0 0 1-2 2H0v11a1.969 1.969 0 0 0 1.933 2h12.134A1.97 1.97 0 0 0 16 18v-3.093l-1.546 1.546c-.413.413-.94.695-1.513.81l-3.4.679a2.947 2.947 0 0 1-1.85-.227 2.96 2.96 0 0 1-1.635-3.257l.681-3.397Z"
            />
            <path
              d="M8.961 16a.93.93 0 0 0 .189-.019l3.4-.679a.961.961 0 0 0 .49-.263l6.118-6.117a2.884 2.884 0 0 0-4.079-4.078l-6.117 6.117a.96.96 0 0 0-.263.491l-.679 3.4A.961.961 0 0 0 8.961 16Zm7.477-9.8a.958.958 0 0 1 .68-.281.961.961 0 0 1 .682 1.644l-.315.315-1.36-1.36.313-.318Zm-5.911 5.911 4.236-4.236 1.359 1.359-4.236 4.237-1.7.339.341-1.699Z"
            />
          </svg>
          <span class="flex-1 ms-3 whitespace-nowrap">Edit</span>
        </a>
      </li>

        <a

          </svg>

        </a>
      </li> -->
    </ul>
  </div>
</aside>

</div>
