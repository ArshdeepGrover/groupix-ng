<div *ngIf="isLoading && user" class="h-[calc(100dvh-112px)]">
  <app-spinner></app-spinner>
</div>

<div class="container">
  <div class="body" *ngIf="!isLoading || !user">
    <div class="top-section">
      <span>Login</span>
    </div>

    <div class="login"></div>

    <div class="divider-line">
      <hr />
      <p>OR</p>
      <hr />
    </div>
    <form (submit)="login()" [formGroup]="loginForm">
      <div class="input-container">
        <label for="email">Your email</label>
        <input
          type="email"
          id="email"
          placeholder="xyz@example.com"
          formControlName="email"
          class="lowercase"
        />
        <div
          *ngIf="
            loginForm.get('email')?.hasError('required') &&
            loginForm.get('email')?.touched
          "
          class="error-message"
        >
          Email is required.
        </div>
        <!-- Error message for invalid email format -->
        <div
          *ngIf="
            loginForm.get('email')?.hasError('email') &&
            loginForm.get('email')?.touched
          "
          class="error-message"
        >
          Please enter a valid email address.
        </div>
      </div>

      <div class="input-container">
        <label for="password">Your password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••••••••"
        />
        <div
          *ngIf="
            loginForm.get('password')?.hasError('required') &&
            loginForm.get('password')?.touched
          "
          class="error-message"
        >
          Password is required.
        </div>
      </div>
      <div
        class="flex md:items-center justify-between flex-col md:flex-row gap-2 md:gap-0"
      >
        <div class="flex items-start">
          <div class="flex items-center h-5">
            <input
              id="remember"
              formControlName="rememberMe"
              type="checkbox"
              class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
            />
          </div>
          <div class="ml-3 text-sm">
            <label for="remember" class="text-gray-500 dark:text-gray-300"
              >Remember me</label
            >
          </div>
        </div>
        <a
          [routerLink]="['/forgot']"
          class="text-sm font-medium text-primary-600 hover:underline dark:text-primary-500"
          >Forgot password?</a
        >
      </div>
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        [ngClass]="{ disable: loginForm.invalid }"
      >
        Login
      </button>
      <p class="text-sm font-light text-gray-500 dark:text-gray-400">
        Don’t have an account yet?
        <a
          [routerLink]="['/signup']"
          class="font-medium text-primary-600 hover:underline dark:text-primary-500"
          >Sign up</a
        >
      </p>
    </form>
  </div>
</div>
