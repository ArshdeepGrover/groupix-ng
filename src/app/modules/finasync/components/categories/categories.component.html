<div class="max-w-lg mx-auto bg-white shadow-md rounded-lg p-6 dark:bg-gray-900">
  <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-4">
    Manage Categories
  </h2>

  <!-- Add Category -->
  <div class="flex items-center gap-2 mb-4">
    <input
      [(ngModel)]="newCategory.name"
      placeholder="Enter category name"
      class="flex-grow border border-gray-300 p-2 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none dark:bg-gray-800 dark:text-white"
    />
    <button
      (click)="addCategory()"
      class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition duration-200 shadow-md"
    >
      Add
    </button>
  </div>

  <!-- Categories List -->
  <ul class="space-y-3">
    <li
      *ngFor="let category of categories"
      class="flex items-center justify-between bg-gray-100 dark:bg-gray-800 p-3 rounded-lg shadow-sm transition duration-200"
    >
      <span class="text-gray-800 dark:text-white font-medium">{{
        category.name
      }}</span>
      <button
        (click)="deleteCategory(category)"
        class="text-red-600 hover:text-red-700 font-semibold transition duration-200"
      >
        Delete
      </button>
    </li>
  </ul>
</div>
