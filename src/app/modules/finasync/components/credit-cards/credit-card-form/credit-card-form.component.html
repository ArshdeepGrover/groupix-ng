<form action="" class="credit-card-create-form" [formGroup]="creditCardForm">
  <h2 class="form-title">
    {{ isUpdateMode ? "Update Credit Card" : "Add New Credit Card" }}
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="card_holder_name"
        >Card Holder Name <span class="required">*</span></label
      >
      <input
        type="text"
        id="card_holder_name"
        placeholder="Card Holder Name"
        required
        formControlName="card_holder_name"
      />
      <p
        *ngIf="
          creditCardForm.controls['card_holder_name'].touched &&
          creditCardForm.controls['card_holder_name'].invalid
        "
        class="mt-2 text-sm text-red-600 dark:text-red-500"
      >
        Name is required.
      </p>
    </div>

    <div>
      <label for="card_nickname">Card Nickname</label>
      <input
        type="text"
        id="card_nickname"
        placeholder="Card Nickname"
        formControlName="card_nickname"
      />
    </div>

    <div>
      <label for="card_number"
        >Card Number <span class="required">*</span></label
      >
      <input
        type="text"
        id="card_number"
        placeholder="Enter 16-digit Card Number"
        required
        formControlName="card_number"
        (input)="formatCreditCardNumber($event)"
      />
      <p
        *ngIf="
          creditCardForm.controls['card_number'].touched &&
          creditCardForm.controls['card_number'].invalid &&
          creditCardForm.controls['card_number'].hasError('pattern')
        "
        class="mt-2 text-sm text-red-600 dark:text-red-500"
      >
        Card is required and should contain 16 digits.
      </p>
    </div>

    <div>
      <label for="bank_name">Bank Name <span class="required">*</span></label>
      <ng-select class="select" formControlName="bank_name">
        <ng-option
          *ngFor="let bankName of bankNames | keyvalue"
          [value]="bankName.value"
        >
          {{ bankName.key }}
        </ng-option>
      </ng-select>
    </div>

    <div>
      <label for="card_type">Card Type <span class="required">*</span></label>
      <select id="card_type" formControlName="card_type">
        <option
          *ngFor="let cardType of ECardType | keyvalue"
          [value]="cardType.value"
        >
          {{ cardType.value | titlecase }}
        </option>
      </select>
    </div>

    <div>
      <label for="expiry_date"
        >Expiry Date <span class="required">*</span></label
      >
      <input
        type="text"
        id="expiry_date"
        placeholder="MM/YY"
        required
        formControlName="expiry_date"
        class="expiry-date-input"
        maxlength="5"
        (input)="formatExpiryDate($event)"
      />
    </div>

    <div>
      <label for="cvv">CVV <span class="required">*</span></label>
      <input
        type="password"
        id="cvv"
        placeholder="CVV"
        required
        formControlName="cvv"
        maxlength="3"
      />
      <p
        *ngIf="
          creditCardForm.controls['cvv'].touched &&
          creditCardForm.controls['cvv'].invalid &&
          creditCardForm.controls['cvv'].hasError('pattern')
        "
        class="mt-2 text-sm text-red-600 dark:text-red-500"
      >
        CVV is required and should contain 3 digits.
      </p>
    </div>

    <div>
      <label for="limit">Credit Limit <span class="required">*</span></label>
      <input
        type="number"
        id="limit"
        placeholder="Credit Limit"
        required
        formControlName="limit"
        min="0"
      />
    </div>

    <div>
      <label for="balance"
        >Current Balance <span class="required">*</span></label
      >
      <input
        type="number"
        id="balance"
        placeholder="Current Balance"
        required
        formControlName="balance"
        min="0"
      />
    </div>

    <div>
      <label for="status">Status <span class="required">*</span></label>
      <select id="status" formControlName="status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div class="flex items-center space-x-2">
      <input
        id="is_primary"
        type="checkbox"
        formControlName="is_primary"
        class="checkbox-input"
      />
      <label for="is_primary" class="checkbox-label">Set as Primary</label>
    </div>
  </div>

  <button type="submit" class="submit-button" (click)="onSubmit()">
    {{ isUpdateMode ? "Update" : "Add" }}
  </button>
</form>
