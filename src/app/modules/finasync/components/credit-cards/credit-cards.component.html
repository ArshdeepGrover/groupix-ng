<div class="p-4">
  <h2 class="text-xl font-bold mb-4">My Credit Cards</h2>
  <app-spinner *ngIf="loading; else creditCardsDetails"></app-spinner>
  <ng-template #creditCardsDetails>
    <div
      *ngFor="let card of creditCards"
      class="bg-white shadow-md rounded-lg p-4 mb-4 flex justify-between items-center"
    >
      <div>
        <h3 class="text-lg font-semibold">
          {{ card.card_nickname || card.card_holder_name }}
        </h3>
        <p class="text-gray-500">
          **** **** **** {{ card.card_number | slice : -4 }}
        </p>
        <p class="text-gray-400">{{ card.bank_name }}</p>
        <span *ngIf="card.is_primary" class="text-green-500 text-sm font-medium"
          >Primary</span
        >
      </div>

      <div class="flex gap-2">
        <button
          *ngIf="!card.is_primary"
          mat-raised-button
          color="primary"
          (click)="setPrimary(card.uuid!)"
        >
          Set Primary
        </button>

        <button
          mat-raised-button
          color="accent"
          (click)="updateCreditCard(card)"
        >
          Edit
        </button>

        <button
          mat-raised-button
          color="warn"
          (click)="deleteCreditCard(card.uuid!)"
        >
          Delete
        </button>
      </div>
    </div>

    <!-- <button mat-raised-button color="primary" (click)="addCreditCard()">
    Add Credit Card
  </button> -->
  </ng-template>
</div>
