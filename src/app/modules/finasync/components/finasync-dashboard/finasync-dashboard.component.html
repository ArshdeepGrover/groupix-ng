<button
  data-drawer-target="default-sidebar"
  data-drawer-toggle="default-sidebar"
  aria-controls="default-sidebar"
  type="button"
  class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
>
  <span class="sr-only">Open sidebar</span>
  <svg
    class="w-6 h-6"
    aria-hidden="true"
    fill="currentColor"
    viewBox="0 0 20 20"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      clip-rule="evenodd"
      fill-rule="evenodd"
      d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
    ></path>
  </svg>
</button>

<aside id="default-sidebar" aria-label="Sidebar">
  <div class="aside-container">
    <ul>
      <li>
        <a
          routerLink="."
          routerLinkActive="active-route"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="bank-accounts" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Bank Accounts</span>
        </a>
      </li>
      <li>
        <a routerLink="credit-cards" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Credit Cards</span>
        </a>
      </li>
      <li>
        <a routerLink="graphs" routerLinkActive="active-route">
          <fa-icon [icon]="icons.faChartArea"></fa-icon>
          <span>Graphs</span>
        </a>
      </li>
      <li>
        <a routerLink="categories" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Categories</span>
        </a>
      </li>
    </ul>
  </div>
</aside>

<div class="right-column">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
