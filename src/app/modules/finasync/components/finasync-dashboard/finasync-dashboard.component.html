<!-- drawer init and show -->
<div class="text-left">
  <button
    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
    type="button"
    data-drawer-target="drawer-navigation"
    data-drawer-toggle="drawer-navigation"
    aria-controls="drawer-navigation"
    data-drawer-backdrop="{true}"
  >
    Show navigation
  </button>
</div>

<!-- drawer component -->
<div
  id="drawer-navigation"
  class="fixed top-[4.5rem] left-0 z-40 h-screen overflow-y-auto transition-transform -translate-x-full bg-white w-64 dark:bg-gray-800 drawer"
  tabindex="-1"
  aria-labelledby="drawer-navigation-label"
>
  <button
    type="button"
    data-drawer-hide="drawer-navigation"
    aria-controls="drawer-navigation"
    class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 absolute top-2.5 end-2.5 inline-flex items-center justify-center dark:hover:bg-gray-600 dark:hover:text-white"
  >
    <svg
      class="w-3 h-3"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 14 14"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
      />
    </svg>
    <span class="sr-only">Close menu</span>
  </button>
  <div class="aside-container">
    <ul>
      <li>
        <a
          routerLink="."
          routerLinkActive="active-route"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="transactions" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Transactions</span>
        </a>
      </li>
      <li>
        <a routerLink="bank-accounts" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Bank Accounts</span>
        </a>
      </li>
      <li>
        <a routerLink="credit-cards" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Credit Cards</span>
        </a>
      </li>
      <li>
        <a routerLink="graphs" routerLinkActive="active-route">
          <fa-icon [icon]="icons.faChartArea"></fa-icon>
          <span>Graphs</span>
        </a>
      </li>
      <li>
        <a routerLink="categories" routerLinkActive="active-route">
          <div class="icon" [innerHTML]="plusIcon"></div>
          <span>Categories</span>
        </a>
      </li>
    </ul>
  </div>
</div>

<div class="right-column">
  <div class="right-column-container">
    <router-outlet></router-outlet>
  </div>
</div>
