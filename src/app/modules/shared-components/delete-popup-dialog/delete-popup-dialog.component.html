<section>
  <div class="heading border-color">
    <div class="title">{{ data.title }}</div>
    <div (click)="cancel()" [innerHTML]="closeButton"></div>
  </div>
  <div class="message">
    <span>{{ data.message }}</span>
  </div>
  <div class="action-button border-color">
    <button
      class="text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-800"
      (click)="confirm()"
    >
      Delete
    </button>
    <button
      (click)="cancel()"
      type="button"
      class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700"
    >
      Cancel
    </button>
  </div>
</section>
