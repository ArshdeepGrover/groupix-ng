<section>
  <div class="heading border-color">
    <div class="title">{{ title }}</div>
    <div [innerHTML]="closeButton"></div>
  </div>
  <div class="message">
    <span>{{ message }}</span>
  </div>
  <div class="action-button border-color">
    <button class="primary-btn" (click)="confirm()">Delete</button>
    <button class="cancel" (click)="cancel()">Cancel</button>
  </div>
</section>
